name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install build twine -c constraints.txt
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Verify installed wheel import contract
        run: |
          python -m venv /tmp/feo-wheel-check
          /tmp/feo-wheel-check/bin/python -m pip install --upgrade pip 'setuptools>=83'
          /tmp/feo-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/feo-wheel-check/bin/python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import finite_element_options
          import finite_element_options.core.market
          import finite_element_options.contracts.backend_capabilities

          dist = md.distribution('finite-element-options')
          top_level = {str(name).split('/')[0] for name in (dist.files or []) if str(name).endswith('.py')}
          assert 'finite_element_options' in top_level
          assert 'src' not in top_level
          assert importlib.util.find_spec('src') is None
          print('installed import contract OK:', finite_element_options.__name__)
          PY
      - name: Execute README examples from installed wheel
        run: /tmp/feo-wheel-check/bin/python scripts/check_readme_examples.py README.md
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finite-element-options-dist-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development profile
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[dev]' -c constraints.txt
      - name: Static, docstring, and type gates
        run: |
          ruff check src tests scripts
          pydocstyle src/finite_element_options
          mypy --ignore-missing-imports --follow-imports=silent src/finite_element_options/contracts src/finite_element_options/validation scripts/check_ci_contract.py
      - name: Architecture contract
        run: python scripts/check_architecture_contract.py
      - name: CI contract
        run: python scripts/check_ci_contract.py
      - name: Documentation capability contract
        run: |
          python scripts/generate_capability_docs.py --check
          python scripts/check_readme_examples.py README.md
      - name: Architecture fitness gate
        run: pytest -q tests/architecture --no-cov
      - name: Packaging contract
        run: pytest -q tests/test_packaging_contract.py --no-cov
      - name: Run tests with coverage
        run: pytest --cov=finite_element_options --cov-report=xml --junitxml=junit.xml
      - name: Run validated benchmark smoke
        run: pytest tests/test_benchmark_black_scholes.py --benchmark-json=benchmark.json
      - name: Upload test, coverage, and benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            benchmark.json
          if-no-files-found: error

  fenicsx_contract:
    name: FEniCSx backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install development profile
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[dev]' -c constraints.txt
      - name: Run FEniCSx backend contract tests
        run: pytest -q tests/test_fenics_solver.py tests/test_benchmark_fenics.py --no-cov

  optional_imports:
    name: optional imports (${{ matrix.profile }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: fd
            python-version: '3.11'
            dependency: findiff
            imports: finite_element_options.fdsolver
          - profile: jax
            python-version: '3.11'
            dependency: jax
            imports: finite_element_options.jax_greeks
          - profile: calibration
            python-version: '3.11'
            dependency: pymc
            imports: finite_element_options.estimation.calibrator,finite_element_options.estimation.heston
          - profile: viz
            python-version: '3.11'
            dependency: matplotlib
            imports: finite_element_options.plots
          - profile: ui
            python-version: '3.11'
            dependency: streamlit
            imports: finite_element_options.sidebar
          - profile: volatility
            python-version: '3.11'
            dependency: arch
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
          - profile: volatility
            python-version: '3.12'
            dependency: arch
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
          - profile: changepoints
            python-version: '3.11'
            dependency: ruptures
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
          - profile: changepoints
            python-version: '3.12'
            dependency: ruptures
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
          - profile: quantlib
            python-version: '3.11'
            dependency: QuantLib
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.quantlib_state
          - profile: quantlib
            python-version: '3.12'
            dependency: QuantLib
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.quantlib_state
          - profile: identifiability
            python-version: '3.11'
            dependency: iminuit
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
          - profile: identifiability
            python-version: '3.12'
            dependency: iminuit
            imports: finite_element_options.examples.regime_switching_quanto.adoption,finite_element_options.examples.regime_switching_quanto.adoption.optional
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install build -c constraints.txt
          python -m build --wheel
      - name: Install optional profile and import advertised modules
        env:
          PROFILE: ${{ matrix.profile }}
          IMPORTS: ${{ matrix.imports }}
          DEPENDENCY: ${{ matrix.dependency }}
        run: |
          python -m venv /tmp/feo-${PROFILE}-check
          /tmp/feo-${PROFILE}-check/bin/python -m pip install --upgrade pip 'setuptools>=83'
          WHEEL=$(ls dist/finite_element_options-*.whl)
          /tmp/feo-${PROFILE}-check/bin/python -m pip install "${WHEEL}[${PROFILE}]"
          cd /tmp
          /tmp/feo-${PROFILE}-check/bin/python - <<'PY'
          import importlib
          import os

          dependency = os.environ['DEPENDENCY']
          dependency_module = importlib.import_module(dependency)
          print('optional dependency OK:', dependency_module.__name__)

          for name in os.environ['IMPORTS'].split(','):
              module = importlib.import_module(name)
              print('optional import OK:', module.__name__)

          if os.environ['PROFILE'] == 'quantlib':
              from finite_element_options.examples.regime_switching_quanto.adoption.quantlib_state import (
                  quantlib_evaluation_date,
              )

              settings = dependency_module.Settings.instance()
              original = settings.evaluationDate
              first = dependency_module.Date(3, dependency_module.January, 2026)
              second = dependency_module.Date(4, dependency_module.January, 2026)

              with quantlib_evaluation_date(first) as quantlib:
                  assert quantlib.__name__ == 'QuantLib'
                  assert settings.evaluationDate == first
              assert settings.evaluationDate == original

              try:
                  with quantlib_evaluation_date(second):
                      assert settings.evaluationDate == second
                      raise RuntimeError('forced QuantLib failure')
              except RuntimeError as exc:
                  assert str(exc) == 'forced QuantLib failure'
              else:
                  raise AssertionError('expected forced QuantLib failure')
              assert settings.evaluationDate == original
              print('QuantLib evaluation date restoration OK')
          PY
          if [ "${PROFILE}" = "quantlib" ]; then
            /tmp/feo-${PROFILE}-check/bin/python -m pip install pytest pytest-cov -c "${GITHUB_WORKSPACE}/constraints.txt"
            /tmp/feo-${PROFILE}-check/bin/python -m pytest -q \
              "${GITHUB_WORKSPACE}/tests/examples/test_regime_switching_quanto_adoption_boundaries.py" \
              "${GITHUB_WORKSPACE}/tests/examples/test_regime_switching_quanto_quantlib_oracle.py" \
              -k 'quantlib or canonical_artifact_scope' --no-cov
          fi

  supply_chain:
    name: supply chain audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[dev,volatility,changepoints,quantlib,identifiability]' -c constraints.txt
          python -m pip install pip-audit cyclonedx-bom -c constraints.txt
      - name: Vulnerability audit
        run: python -m pip_audit --progress-spinner=off --skip-editable
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.json
      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: sbom.json
          if-no-files-found: error
